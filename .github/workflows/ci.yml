name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: locigraph
          POSTGRES_USER: locigraph
          POSTGRES_PASSWORD: changeme
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U locigraph" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
    # test-only values mirroring README local dev
    env:
      APP_DB_PASSWORD: changeme
      DATABASE_URL: postgresql+asyncpg://locigraph_app:changeme@localhost:5432/locigraph
      MIGRATION_DATABASE_URL: postgresql+asyncpg://locigraph:changeme@localhost:5432/locigraph
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-only-secret
      LOCIGRAPH_EMAIL: ci@example.com
      LOCIGRAPH_PASSWORD: changeme
      RAW_STORAGE_PATH: /tmp/locigraph-raw
      ACTIVE_AI_PROVIDER: openai
      OPENAI_API_KEY: ""
      OPENAI_EXTRACTION_MODEL: gpt-5.4-nano
      CLAIM_EXTRACTION_AUTORUN: "false"
      CLAIM_EXTRACTION_BATCH_SIZE: "12"
      COOKIE_SECURE: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
      - run: uv venv && uv pip install -e '.[dev]'
      - run: .venv/bin/alembic upgrade head
      - run: .venv/bin/pytest -q
